services:
  - type: web
    name: oesk-inventory-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SHEETS_CSV_URL
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      # Строка из Neon (Dashboard → Connection string → URI)
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
